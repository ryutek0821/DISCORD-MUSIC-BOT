name: Version Tag on Merge

on:
  push:
    branches:
      - master
  # Allows a hand re-run after a failed tag/release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and tag
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const alreadyExists = (e) =>
              e.status === 422 && /already[_ ]exists/i.test(e.message);

            const { data: tags } = await github.rest.repos.listTags({
              owner, repo, per_page: 100,
            });

            // If this commit is already tagged, reuse that tag instead of
            // bumping. A retry after a failed release step must repair the
            // existing tag, not mint a fresh one and orphan the old.
            const tagged = tags.find((t) => t.commit.sha === context.sha);
            let tagName;

            if (tagged) {
              tagName = tagged.name;
              console.log(`${context.sha} is already tagged ${tagName}; reusing it.`);
            } else {
              // listTags is not ordered by version, so tags[0] can hand back an
              // old release and make the bump collide with an existing tag.
              const versions = tags
                .map((t) => t.name.replace(/^v/, '').split('.').map(Number))
                .filter((p) => p.length === 3 && p.every(Number.isInteger));
              versions.sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);

              const [major, minor, patch] = versions[0] || [0, 0, 0];
              tagName = `v${major}.${minor}.${patch + 1}`;
              console.log(`Bumping version: ${major}.${minor}.${patch} -> ${tagName}`);

              try {
                await github.rest.git.createRef({
                  owner, repo,
                  ref: `refs/tags/${tagName}`,
                  sha: context.sha,
                });
                console.log(`Created tag ${tagName}`);
              } catch (e) {
                if (!alreadyExists(e)) {
                  core.setFailed(`Failed to create tag ${tagName}: ${e.message}`);
                  return;
                }
                console.log(`Tag ${tagName} already exists; continuing to the release.`);
              }
            }

            // Separate try/catch from the tag: sharing one used to swallow a
            // release failure that happened after the tag was created, leaving
            // a tag no re-run would ever give a release.
            try {
              await github.rest.repos.createRelease({
                owner, repo,
                tag_name: tagName,
                name: `Version ${tagName.replace(/^v/, '')}`,
                body: `Auto-generated release for ${tagName}`,
              });
              console.log(`Created release ${tagName}`);
            } catch (e) {
              if (alreadyExists(e)) {
                console.log(`Release ${tagName} already exists; nothing to do.`);
                return;
              }
              core.setFailed(
                `Tag ${tagName} exists but release creation failed: ${e.message}`
              );
            }